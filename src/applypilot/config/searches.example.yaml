# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml or generate via: applypilot init
#
# Tuned for technical infrastructure roles:
#   Data Center Network · AI Infrastructure · Hardware Validation · SRE · Platform

# Search queries — tier 1 is highest priority / precision
queries:
  # --- Data Center Network ---
  - query: "Data Center Network Engineer"
    tier: 1
  - query: "Network Engineer Data Center"
    tier: 1
  - query: "Senior Network Engineer"
    tier: 1
  - query: "DC Network Engineer"
    tier: 2
  - query: "Network Engineer"
    tier: 2

  # --- AI Infrastructure ---
  - query: "AI Infrastructure Engineer"
    tier: 1
  - query: "ML Infrastructure Engineer"
    tier: 1
  - query: "AI Platform Engineer"
    tier: 2
  - query: "GPU Cluster Engineer"
    tier: 2

  # --- Hardware Validation ---
  - query: "Hardware Validation Engineer"
    tier: 1
  - query: "Silicon Validation Engineer"
    tier: 1
  - query: "System Validation Engineer"
    tier: 2
  - query: "Hardware Test Engineer"
    tier: 2

  # --- SRE (Infrastructure) ---
  - query: "Site Reliability Engineer"
    tier: 1
  - query: "SRE"
    tier: 1
  - query: "Infrastructure SRE"
    tier: 1
  - query: "Production Engineer"
    tier: 2
  - query: "Reliability Engineer"
    tier: 2

  # --- Platform ---
  - query: "Platform Engineer"
    tier: 1
  - query: "Cloud Platform Engineer"
    tier: 1
  - query: "Developer Platform Engineer"
    tier: 2
  - query: "Infrastructure Platform Engineer"
    tier: 2

  # --- Broader net ---
  - query: "Infrastructure Engineer"
    tier: 3
  - query: "DevOps Engineer"
    tier: 3
  - query: "Systems Engineer"
    tier: 3

# Locations to search
locations:
  - location: "United States"
    remote: false
  - location: "Remote"
    remote: true

# Location filtering — accept/reject patterns for job location text
location:
  accept_patterns:
    - "United States"
    - "US"
    - "USA"
    - "Remote"
    - "Anywhere"
    - "Hybrid"
  reject_patterns:
    - "India only"
    - "Philippines"
    - "onsite only"
    - "London, UK only"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "USA"

# JobSpy source boards
boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours
  distance: 50           # Miles (ignored when remote=true)

# Negative keywords — skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
  - "sales engineer"
  - "account executive"
  - "recruiter"
  - "data scientist"
  - "ml researcher"
  - "help desk"
  - "desktop support"
