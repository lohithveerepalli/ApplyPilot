# Major career sites — discovery via public search pages / APIs where available.
# Apply strategies differ (see ats/strategies.py). Many require manual or Claude.
careers:
  - { id: amazon, name: "Amazon", careers_url: "https://www.amazon.jobs/en/search", ats: "amazon", apply_difficulty: hard }
  - { id: google, name: "Google", careers_url: "https://careers.google.com/jobs/results/", ats: "google", apply_difficulty: hard }
  - { id: meta, name: "Meta", careers_url: "https://www.metacareers.com/jobs", ats: "meta", apply_difficulty: hard }
  - { id: microsoft, name: "Microsoft", careers_url: "https://jobs.careers.microsoft.com/global/en/search", ats: "microsoft", apply_difficulty: hard }
  - { id: apple, name: "Apple", careers_url: "https://jobs.apple.com/en-us/search", ats: "apple", apply_difficulty: hard }
  - { id: oracle, name: "Oracle", careers_url: "https://careers.oracle.com/", ats: "oracle", apply_difficulty: medium }
  - { id: ibm, name: "IBM", careers_url: "https://www.ibm.com/careers/search", ats: "ibm", apply_difficulty: medium }
  - { id: cisco, name: "Cisco", careers_url: "https://jobs.cisco.com/jobs/SearchJobs", ats: "workday", apply_difficulty: medium }
  - { id: arista, name: "Arista", careers_url: "https://www.arista.com/en/careers/open-positions", ats: "greenhouse", apply_difficulty: medium }
  - { id: juniper, name: "Juniper", careers_url: "https://jobs.juniper.net/", ats: "workday", apply_difficulty: medium }

# Title keywords that mark a job as high priority for hunt mode (infra focus)
priority_title_keywords:
  - "data center"
  - "datacenter"
  - "hardware validation"
  - "server test"
  - "hpc"
  - "gpu"
  - "ai infrastructure"
  - "ml infrastructure"
  - "network engineer"
  - "site reliability"
  - "platform engineer"
  - "rack"
  - "infrastructure technician"
  - "facilities technician"
  - "silicon validation"
  - "bring-up"
  - "bringup"
