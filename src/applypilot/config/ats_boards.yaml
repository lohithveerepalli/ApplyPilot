# ATS job board registry — public APIs / career boards
# Used by discovery/ats_boards.py and hunt mode.
#
# board_token = Greenhouse board token (from boards.greenhouse.io/{token})
# company     = Lever company slug (jobs.lever.co/{company})
# ashby       = Ashby job board name
#
# Focus: infra / AI / hardware / data center friendly employers.

